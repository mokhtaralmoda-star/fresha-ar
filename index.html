function vs(cc,ck,cat){var c=cityOf(cc,ck);if(!c)return[];var out=[];for(var i=0;i<6;i++){var s=H(ck+cat+i);out.push({id:ck+'__'+cat+'__'+i,n:PRE[s%PRE.length]+' '+NM[Math.floor(s/8)%NM.length],a:AR[s%AR.length]+'، '+c.n,p:c.dial+' '+(2+s%8)+' '+(100+s%800)+' '+(1000+s%8999),r:(4.1+(s%9)/10).toFixed(1),rc:40+s%520,cat:cat,cc:cc,ck:ck,cur:curOf(cc),lat:24+((s%180)-90)/90,lng:46+((s%180)-90)/90})}return out}
function all(cc,ck){var o=[];CAT.forEach(function(x){o=o.concat(vs(cc,ck,x[0]))});return o}
function byId(id){var p=id.split('__');return vs(S.cc,p[0],p[1]).filter(function(v){return v.id===id})[0]}
function ph(v,i){return 'https://images.unsplash.com/'+PHO[(H(v.id)+i)%PHO.length]+'?auto=format&fit=crop&w=800&q=65'}
function off(v){return H(v.id)%4===0}
function svc(v){var b=SVN[v.cat]||SVN.hair;var s=H(v.id);return b.map(function(x){return{n:x[0],p:Math.round(x[1]*(0.85+(s%35)/100)),m:30+(s%60)}})}
function hours(v){var s=H(v.id);var o=[];for(var d=0;d<7;d++){if(d===6&&s%2)o.push(null);else o.push([9+s%3,20+s%3])}return o}
function open(v){var h=new Date().getHours();var t=hours(v)[new Date().getDay()];return !!(t&&h>=t[0]&&h<t[1])}
var app=document.getElementById('app');
function go(p){history.pushState({},'','/'+p.replace(/^\/+/,''));render()}
window.onpopstate=render;
function A(p,i,c,l){return '<a href="/'+p+'"'+(c?' class="'+c+'"':'')+(l?' aria-label="'+l+'"':'')+' onclick="go(\''+p+'\');return false">'+i+'</a>'}
function shell(x){app.innerHTML='<header><div class="w hi"><a class="lg" href="/" onclick="go(\'\');return false">فريشا</a><div class="sp"></div>'+A('cities','☰ القائمة','hb')+A('biz','للأعمال','hb')+A('account','تسجيل الدخول','hb')+'</div></header><main class="w">'+x+'</main><footer class="ft"><div class="w"><div class="fc"><div><h4>fresha</h4>'+A('','الرئيسية')+A('s','بحث')+A('bk','حجوزاتي')+A('fav','المفضلة')+'</div><div><h4>العملة</h4><a href="#" onclick="pickCur();return false">'+S.cur+'</a></div><div><h4>الأعمال</h4>'+A('biz','لوحة التحكم')+A('gift','بطاقة هدية')+A('pkg','الباقات')+'</div><div><h4>قانوني</h4>'+A('terms','الشروط')+A('privacy','الخصوصية')+'</div></div><p style="margin-top:20px;opacity:.6">© 2026 fresha — نسخة عربية</p></div></footer>'}
function pickCur(){var v=prompt('العملة (SAR, AED, USD, EGP...)',S.cur);if(v&&RATE[v.toUpperCase()]){S.cur=v.toUpperCase();save();render()}}
function card(v){var f=S.fav.indexOf(v.id)>-1;var u='v/'+v.cc+'-'+v.ck+'/'+v.id;
return '<div class="card"><div class="th">'+A(u,'<img loading="lazy" src="'+ph(v,0)+'" alt="'+esc(v.n)+'">')+(off(v)?'<span class="bdg">خصم ٢٠٪</span>':'')+'<button class="fv" onclick="fav(\''+v.id+'\');return false">'+(f?'♥':'♡')+'</button></div><div class="cb"><div class="nm">'+A(u,esc(v.n))+'</div><div class="mt"><span class="st">★ '+v.r+'</span><span>('+v.rc+')</span><span>·</span><span>'+esc(v.a)+'</span></div><div style="margin-top:6px"><span class="pl">'+catN(v.cat)+'</span></div></div></div>'}
function fav(id){var i=S.fav.indexOf(id);if(i<0)S.fav.push(id);else S.fav.splice(i,1);save();render()}
function render(){var p=location.pathname.replace(/^\/+/,'').split('?')[0];var g=p.split('/').filter(Boolean);app.innerHTML='';
if(!g.length)return home();
if(g[0]==='c'&&g[1])return cat(g[1]);
if(g[0]==='ct'&&g[1])return country(g[1]);
if(g[0]==='city')return cities();
if(g[0]==='t'&&g[1]){var q=g[1].split('-');return city(q[0],g[1].slice(q[0].length+1))}
if(g[0]==='v'&&g[1]&&g[2]){var q2=g[1].split('-');return venue(q2[0],g[1].slice(q2[0].length+1),g[2])}
if(g[0]==='s')return search();
if(g[0]==='account')return stat('تسجيل الدخول','سجّل الدخول لمتابعة حجوزاتك.');if(g[0]==='fav')return favs();
if(g[0]==='bk')return bks();
if(g[0]==='b')return book();
if(g[0]==='gift')return gift();
if(g[0]==='pkg')return pkg();
if(g[0]==='biz')return biz();
if(g[0]==='terms')return stat('الشروط والأحكام','باستخدامك المنصة أنت توافق على الشروط.');
if(g[0]==='privacy')return stat('سياسة الخصوصية','نستخدم بياناتك لتحسين الخدمة فقط.');
return home()}
function home(){var c=cityOf(S.cc,S.ck)||cityOf("sa","riyadh");var n=all(S.cc,S.ck).sort(function(a,b){return b.r-a.r}).slice(0,8);
shell('<div class="hero"><h1>احجزوا خدمات الرعاية<br>الذاتية المحلية</h1><p>اكتشفوا أفضل الصالونات والمراكز الصحية وخبراء التجميل الذين يثق بهم الملايين في جميع أنحاء العالم</p><div class="sb"><div class="seg" style="flex:1"><input id="q" placeholder="جميع العلاجات" onkeydown="if(event.key===\'Enter\')go(\'s?q=\'+encodeURIComponent(this.value))"></div><div class="seg">📍 '+c.n+'</div><div class="seg">🗓️ أي وقت</div><button onclick="go(\'s?q=\'+encodeURIComponent(document.getElementById(\'q\').value))">🔍</button></div><div class="cnt"><b>645,659</b> موعد محجوز اليوم</div><a class="dl" href="#" onclick="return false">▦ تنزيل التطبيق</a></div><div class="chips">'+CAT.map(function(x){return A('c/'+x[0],x[2]+' '+x[1],'chip')}).join('')+'</div><div class="sct"><h2>الأعلى تقييماً في '+c.n+'</h2>'+A('t/'+S.cc+'-'+S.ck,'عرض الكل')+'</div><div class="grid">'+n.map(card).join('')+'</div><div class="sct"><h2>تصفح الدول</h2>'+A('city','الكل')+'</div><div class="grid">'+CO.slice(0,8).map(function(o){return '<div class="card">'+A('ct/'+o[0],'<div class="cb"><div class="nm">'+o[1]+'</div><div class="mt">'+o[3].length+' مدينة</div></div>')+'</div>'}).join('')+'</div>')}
function cat(k){var r=[];CO.forEach(function(o){o[3].forEach(function(z){r=r.concat(vs(o[0],z[0],k))})});r.sort(function(a,b){return b.r-a.r});
var per=24,pg=1;var pages=Math.ceil(r.length/per);
shell('<div class="sct"><h2>'+catN(k)+'</h2><span class="pl">'+r.length+' نتيجة</span></div><div class="grid">'+r.slice(0,per).map(card).join('')+'</div>')}
function country(cc){var o=co(cc);if(!o)return home();
shell('<div class="sct"><h2>'+o[1]+'</h2></div><div class="grid">'+o[3].map(function(z){return '<div class="card">'+A('t/'+cc+'-'+z[0],'<div class="cb"><div class="nm">'+z[1]+'</div><div class="mt">'+all(cc,z[0]).length+' مكان</div></div>')+'</div>'}).join('')+'</div>')}
function cities(){shell('<div class="sct"><h2>كل الدول</h2></div><div class="grid">'+CO.map(function(o){return '<div class="card">'+A('ct/'+o[0],'<div class="cb"><div class="nm">'+o[1]+'</div><div class="mt">'+o[3].length+' مدينة</div></div>')+'</div>'}).join('')+'</div>')}
function city(cc,ck){var c=cityOf(cc,ck);if(!c)return home();S.cc=cc;S.ck=ck;S.cur=curOf(cc);save();
var r=all(cc,ck).sort(function(a,b){return b.r-a.r});
shell('<div class="sct"><h2>'+c.n+'</h2><span class="pl">'+r.length+' مكان</span></div><div class="chips">'+CAT.map(function(x){return A('c/'+x[0],x[2]+' '+x[1],'chip')}).join('')+'</div><div class="grid">'+r.map(card).join('')+'</div>')}
function venue(cc,ck,id){var v=byId(id);if(!v)return home();var sv=svc(v),h=hours(v);
shell('<div class="gal">'+[0,1,2,3,4].map(function(i){return '<img src="'+ph(v,i)+'" alt="'+esc(v.n)+'">'}).join('')+'</div><div class="vh"><h1>'+esc(v.n)+'</h1><div class="mt"><span class="st">★ '+v.r+'</span><span>('+v.rc+' تقييم)</span><span>·</span><span>'+esc(v.a)+'</span><span class="pl '+(open(v)?'':'c')+'">'+(open(v)?'مفتوح':'مغلق')+'</span></div><div class="mt" style="margin-top:6px">'+esc(v.p)+'</div></div><div id="map"></div><div class="vr"><div><div class="sct"><h2>الخدمات</h2></div>'+sv.map(function(s,i){return '<button class="sv" onclick="start(\''+v.id+'\','+i+')"><span><b>'+s.n+'</b><div class="mt">'+s.m+' دقيقة</div></span><b>'+money(s.p,v.cur)+'</b></button>'}).join('')+'<div class="sct"><h2>ساعات العمل</h2></div><div class="pn">'+['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map(function(d,i){return '<div class="row"><span>'+d+'</span><span>'+(h[i]?h[i][0]+':00 – '+h[i][1]+':00':'مغلق')+'</span></div>'}).join('')+'</div></div><div><div class="pn"><div class="mt">يبدأ من</div><div style="font-size:20px;font-weight:800;margin:4px 0 10px">'+money(sv[0].p,v.cur)+'</div><button class="btn" onclick="start(\''+v.id+'\',0)">احجز الآن</button><a class="btn o" style="margin-top:7px" href="tel:'+v.p.replace(/\s/g,'')+'">اتصل</a></div></div></div>');
setTimeout(function(){try{var m=L.map('map').setView([v.lat,v.lng],13);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(m);L.marker([v.lat,v.lng]).addTo(m)}catch(e){}},120)}
function start(id,i){S.b={id:id,i:i,step:1,d:null,t:null};save();go('b')}
function book(){var b=S.b;if(!b)return home();var v=byId(b.id);if(!v)return home();var sv=svc(v),s=sv[b.i],h=hours(v);
if(!b.d)b.d=new Date().toISOString().slice(0,10);
var dh=h[new Date(b.d).getDay()];var slots=[];if(dh)for(var m=dh[0]*60;m<dh[1]*60;m+=30)slots.push(('0'+Math.floor(m/60)).slice(-2)+':'+('0'+m%60).slice(-2));
var days=[];for(var i=0;i<14;i++){var d=new Date();d.setDate(d.getDate()+i);days.push(d)}
shell('<div style="max-width:620px;margin:0 auto"><div class="steps"><div class="stp on"></div><div class="stp '+(b.step>1?'on':'')+'"></div><div class="stp '+(b.step>2?'on':'')+'"></div></div><div class="pn"><b>'+esc(v.n)+'</b><div class="mt">'+esc(v.a)+'</div><div style="margin-top:8px">'+s.n+' · <b>'+money(s.p,v.cur)+'</b></div></div>'
+(b.step===1?'<div class="sct"><h2>التاريخ</h2></div><div class="days">'+days.map(function(d){var k=d.toISOString().slice(0,10);return '<div class="day '+(b.d===k?'on':'')+'" onclick="setD(\''+k+'\')"><b>'+d.getDate()+'</b>'+d.toLocaleDateString('ar-EG',{weekday:'short'})+'</div>'}).join('')+'</div><div class="sct"><h2>الوقت</h2></div>'+(slots.length?'<div class="slots">'+slots.map(function(x){return '<div class="slot '+(b.t===x?'on':'')+'" onclick="setT(\''+x+'\')">'+x+'</div>'}).join('')+'</div>':'<p>مغلق</p>')+'<button class="btn" style="margin-top:12px" '+(b.t?'':'disabled')+' onclick="S.b.step=2;save();render()">متابعة</button>'
:b.step===2?'<div class="pn"><label>الاسم</label><input id="n"><label style="display:block;margin-top:8px">الجوال</label><input id="p" dir="ltr"><label style="display:block;margin-top:8px">الدفع</label><select id="py"><option value="arrival">عند الوصول</option><option value="card">بطاقة</option><option value="gift">رصيد هدية</option></select><button class="btn" style="margin-top:12px" onclick="done()">تأكيد الحجز</button></div>'
:'<div class="pn" style="text-align:center"><div style="font-size:34px">✅</div><h3>تم الحجز</h3><div class="mt" style="justify-content:center">مرجع '+b.ref+'</div><a class="btn o" style="margin-top:12px" href="/bk" onclick="go(\'bk\');return false">حجوزاتي</a></div>')+'</div>')}
function setD(k){S.b.d=k;S.b.t=null;save();render()}
function setT(x){S.b.t=x;save();render()}
function done(){var b=S.b;var v=byId(b.id);var s=svc(v)[b.i];var py=document.getElementById('py').value;
b.name=document.getElementById('n').value;b.phone=document.getElementById('p').value;b.pay=py;
b.ref='FR'+H(b.id+b.d+b.t)%900000;b.when=b.d+' '+b.t;b.vn=v.n;b.sn=s.n;b.total=money(s.p,v.cur);b.st='confirmed';b.vid=v.id;b.step=3;
S.bk.unshift(JSON.parse(JSON.stringify(b)));save();render()}
function bks(){shell('<div class="sct"><h2>حجوزاتي</h2></div>'+(S.bk.length?S.bk.map(function(b){return '<div class="pn" style="margin-bottom:10px"><div class="row"><div><b>'+esc(b.vn)+'</b><div class="mt">'+esc(b.sn)+' · '+b.when+'</div><div class="mt">مرجع '+b.ref+' · '+b.total+'</div></div><span class="pl '+(b.st==='cancelled'?'c':'')+'">'+(b.st==='cancelled'?'ملغي':'مؤكد')+'</span></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn o" onclick="cancel(\''+b.ref+'\')">إلغاء</button><a class="btn o" href="/v/'+b.vid+'" onclick="go(\'v/'+b.vid+'\');return false">المكان</a></div></div>'}).join(''):'<div class="empty">لا حجوزات</div>'))}
function cancel(r){S.bk=S.bk.map(function(x){if(x.ref===r)x.st='cancelled';return x});save();render()}
function favs(){shell('<div class="sct"><h2>المفضلة</h2></div><div class="grid">'+(S.fav.map(function(id){var v=byId(id);return v?card(v):''}).join('')||'<div class="empty">لا مفضلات</div>')+'</div>')}
function search(){var q=(new URLSearchParams(location.search).get('q')||'');var r=[];
if(q)CO.forEach(function(o){o[3].forEach(function(z){all(o[0],z[0]).forEach(function(v){if(v.n.indexOf(q)>-1||z[1].indexOf(q)>-1||svc(v).some(function(s){return s.n.indexOf(q)>-1}))r.push(v)})})});
shell('<div class="sct"><h2>بحث</h2><span class="pl">'+r.length+'</span></div><div class="sb" style="margin-bottom:12px"><input id="q2" value="'+esc(q)+'" placeholder="ابحث"><button onclick="go(\'s?q=\'+encodeURIComponent(document.getElementById(\'q2\').value))">ابحث</button></div><div class="grid">'+(r.map(card).join('')||'<div class="empty">لا نتائج</div>')+'</div>')}
function gift(){shell('<div style="max-width:520px;margin:0 auto"><h2>بطاقة هدية</h2><div class="pn"><div style="margin-bottom:10px">المبلغ</div><select id="ga"><option>100</option><option>200</option><option>300</option><option>500</option><option>1000</option></select><button class="btn" style="margin-top:12px" onclick="buyGift()">شراء</button><div class="mt" style="margin-top:10px">رصيدك: '+money(S.gift,S.cur)+'</div></div></div>')}
function buyGift(){var v=+document.getElementById('ga').value;S.gift+=v;save();render();toast('تمت إضافة الرصيد')}
function pkg(){var v=all(S.cc,S.ck)[0];var p=[['٣ جلسات',3,.15],['٥ جلسات',5,.25],['١٠ جلسات',10,.35]];
shell('<div style="max-width:620px;margin:0 auto"><h2>الباقات</h2><p class="mt">وفّر أكثر بالشراء المسبق</p>'+p.map(function(x){return '<div class="pn" style="margin-top:10px"><div class="row"><div><b>'+x[0]+'</b><div class="mt">خصم '+Math.round(x[2]*100)+'%</div></div><b>'+money(svc(v)[0].p*x[1]*(1-x[2]),v.cur)+'</b></div></div>'}).join('')+'</div>')}
function biz(){var t=[['dashboard','لوحة'],['calendar','التقويم'],['clients','العملاء'],['reports','التقارير']];
shell('<h2>لوحة الأعمال</h2><div class="tabs">'+t.map(function(x){return '<button>'+x[1]+'</button>'}).join('')+'</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div class="stt"><b>١٤٢</b>حجز أسبوعي</div><div class="stt"><b>٩٬٤٨٠</b>الإيراد</div><div class="stt"><b>٤.٩ ★</b>التقييم</div><div class="stt"><b>٨٧٪</b>عودة العملاء</div></div><div class="pn" style="margin-top:14px"><b>أحدث الحجوزات</b>'+['نورة ع.','خالد م.','ريم س.','عمر ط.'].map(function(n,i){return '<div class="row"><span>'+n+'</span><span class="pl">'+['قص','مساج','مانيكير','صبغة'][i]+'</span></div>'}).join('')+'</div>')}
function stat(a,b){shell('<div style="max-width:620px;margin:0 auto"><h2>'+a+'</h2><p>'+b+'</p><a class="btn o" href="/" onclick="go(\'\');return false">الرئيسية</a></div>')}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2400)}
render();
</script>
</body>
